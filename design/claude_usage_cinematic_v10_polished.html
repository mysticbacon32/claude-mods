<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude Capacity | Living Liquid V9</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#030509;color:#fff;font-family:system-ui,-apple-system,Arial,sans-serif}body{padding:12px}.shell{width:min(100%,840px);margin:auto}.scene{width:100%;aspect-ratio:1227/905;position:relative;overflow:hidden;background:#030509}.scene img{width:100%;height:100%;display:block}.vial{position:absolute;top:28.5%;height:51.1%;width:19.8%;overflow:hidden;border-radius:8% 8% 9% 9%;pointer-events:none;mix-blend-mode:screen}.vial.week{left:20.3%;--c:#ff36d7;--light:#ffb3f4}.vial.five{left:60.1%;--c:#a8ff35;--light:#d7ff83}
.fluid{position:absolute;bottom:0;left:0;width:100%;height:var(--level);transition:height .45s cubic-bezier(.2,.7,.2,1);opacity:.87;isolation:isolate;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 55%,transparent))}
.liquid-body{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.liquid-shape{fill:var(--c);fill-opacity:.76}
.liquid-surface{fill:none;stroke:var(--light);stroke-width:1.3;opacity:.42;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 2px var(--c))}
.liquid-sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#fff1,transparent 18%,transparent 82%,#fff2);mix-blend-mode:screen}
.bubbles{position:absolute;inset:0;overflow:hidden}
.bubble{position:absolute;bottom:-12px;border:1px solid color-mix(in srgb,var(--light) 75%,white);border-radius:50%;box-shadow:inset -1px -1px 3px var(--c),0 0 4px var(--c);opacity:0;animation:bubbleRise var(--dur) linear infinite;animation-delay:var(--delay);left:var(--x);width:var(--sz);height:var(--sz)}

@keyframes particleFlow{to{background-position:10px -180px}}
@keyframes bubbleRise{0%{transform:translate(0,0) scale(.8);opacity:0}14%{opacity:.55}82%{opacity:.35}100%{transform:translate(9px,-350px) scale(1.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.bubble{animation:none}.liquid-body animate{display:none}.fluid{transition:none}}
.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#fff2,transparent 14%,transparent 82%,#fff3 96%,transparent);opacity:.45}.readouts{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:linear-gradient(#05060b,#090a12);padding:6px 14px 16px}.readout{text-align:center;--c:#ff36d7;min-width:0}.readout.five{--c:#a8ff35}.title{color:var(--c);font-size:clamp(12px,3.2vw,24px);font-weight:850;letter-spacing:.035em;text-shadow:0 0 10px var(--c)}.value{font-size:clamp(36px,9vw,84px);font-weight:900;line-height:1.08;color:var(--c);text-shadow:0 0 16px color-mix(in srgb,var(--c) 75%,transparent);font-variant-numeric:tabular-nums}.remaining{font-size:clamp(10px,2.3vw,19px);font-weight:750;color:#bfc4d6;letter-spacing:.035em}.track{height:clamp(9px,2.5vw,21px);margin:12px auto 0;max-width:94%;border:2px solid var(--c);border-radius:7px;background:#05050c;box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,white));transition:width .2s}.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:#0d111b;border:1px solid #2b3548;border-radius:13px;padding:17px;margin:12px 0}.controls label{display:block;font-size:12px;letter-spacing:.07em;color:#c3c9d8}.controls input{width:100%;margin-top:13px;accent-color:#ff36d7;touch-action:pan-x}.controls label:last-child input{accent-color:#a8ff35}.note{font-size:11px;color:#8893a7;text-align:center;margin:12px}@media(max-width:600px){body{padding:0}.readouts{gap:6px;padding:5px 8px 13px}.controls{margin:10px;gap:10px;padding:12px}.controls label{font-size:11px}.track{margin-top:9px}}

/* V10 polish: restrained typographic, spacing and interaction refinements. Liquid geometry is unchanged. */
:root{color-scheme:dark}
.shell{isolation:isolate}
.scene{background:#020409}
.readouts{gap:12px;padding:9px 17px 18px;background:linear-gradient(180deg,#06070d 0%,#080a12 100%)}
.title{line-height:1.25;letter-spacing:.055em}
.value{letter-spacing:-.035em;line-height:1.03;margin:5px 0 2px}
.remaining{letter-spacing:.065em;line-height:1.35}
.track{margin-top:14px;border-radius:9px;box-shadow:0 0 10px color-mix(in srgb,var(--c) 34%,transparent),inset 0 1px 3px #000c}
.bar{border-radius:5px 0 0 5px;transition:width .28s cubic-bezier(.22,.68,0,1)}
.controls{border-color:#30394b;background:linear-gradient(145deg,#101521,#0a0f19);box-shadow:0 6px 24px #0004;padding:18px 20px;gap:22px}
.controls label{font-weight:600;letter-spacing:.085em;line-height:1.4}
.controls input{display:block;cursor:pointer;min-height:28px;margin:8px 0 0}
.controls input:focus-visible{outline:2px solid #dee8fb;outline-offset:3px;border-radius:8px}
.note{max-width:600px;margin:13px auto 19px;line-height:1.5;letter-spacing:.015em}
@media(max-width:600px){
 .readouts{padding:7px 9px 15px;gap:8px}
 .title{font-size:clamp(11px,3.2vw,18px)}
 .value{margin:5px 0 3px}
 .remaining{font-size:clamp(9px,2.35vw,14px);letter-spacing:.025em}
 .track{margin-top:11px}
 .controls{margin:12px 10px 0;padding:13px 14px;gap:13px;border-radius:14px}
 .controls label{font-size:10px}
 .note{padding:0 13px;margin:12px auto 20px}
}
@media(prefers-reduced-motion:reduce){.bar{transition:none}}
