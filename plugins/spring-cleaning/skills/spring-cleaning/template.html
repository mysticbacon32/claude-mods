<title>Spring Cleaning Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column. Run summary and three savings tiles up top, then one ledger table per area. */
:root {
  --bg: #F3F6F2;
  --surface: #FFFFFF;
  --ink: #17221B;
  --ink-soft: #56645B;
  --line: #DCE4DD;
  --accent: #2C7A55;
  --accent-soft: #E1F0E7;
  --safe: #2C7A55;    --safe-bg: #E1F0E7;
  --careful: #8A5A08; --careful-bg: #FBEFD7;
  --you: #2E5C9E;     --you-bg: #E2EBF8;
  --muted-bg: #ECEFEC;
  --font-display: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #1A211C; --ink: #E7EEE9; --ink-soft: #9BAAA0; --line: #2C3730;
    --accent: #6CCB9A; --accent-soft: #1D3428;
    --safe: #6CCB9A; --safe-bg: #1D3428; --careful: #E8B65A; --careful-bg: #3A2D13; --you: #8DB4F0; --you-bg: #1C2A40;
    --muted-bg: #222B25; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #1A211C; --ink: #E7EEE9; --ink-soft: #9BAAA0; --line: #2C3730;
  --accent: #6CCB9A; --accent-soft: #1D3428;
  --safe: #6CCB9A; --safe-bg: #1D3428; --careful: #E8B65A; --careful-bg: #3A2D13; --you: #8DB4F0; --you-bg: #1C2A40;
  --muted-bg: #222B25; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 40px 80px; display: grid; gap: 36px; }
header { display: grid; gap: 10px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 5vw, 46px); line-height: 1.05; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.meta { color: var(--ink-soft); margin: 0; max-width: 70ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 4px; }
.tile .label { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.tile .value { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 13px; color: var(--ink-soft); }
.note { font-size: 13.5px; color: var(--ink-soft); background: var(--muted-bg); border-radius: 10px; padding: 12px 16px; margin: 0; max-width: none; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--ink-soft); align-items: center; }
section { display: grid; gap: 12px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h2 .area-total { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink-soft); }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
th.num { text-align: right; }
td.id { font-family: var(--font-mono); color: var(--ink-soft); width: 44px; }
.title { font-weight: 600; }
.detail { color: var(--ink-soft); font-size: 13px; margin-top: 3px; word-break: break-word; }
.fix { font-size: 13px; margin-top: 6px; }
.fix b { font-weight: 600; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.safe { background: var(--safe-bg); color: var(--safe); }
.pill.careful { background: var(--careful-bg); color: var(--careful); }
.pill.you { background: var(--you-bg); color: var(--you); }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--muted-bg); color: var(--ink-soft); font-family: var(--font-body); }
.basis { display: block; font-family: var(--font-body); font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
.dash { color: var(--ink-soft); }
.empty { color: var(--ink-soft); }
ul.cc { margin: 0; padding-left: 20px; color: var(--ink-soft); }
@media (max-width: 480px) { .tile .value { font-size: 28px; } }
</style>

<div class="wrap" id="app">
  <header>
    <p class="eyebrow">Spring cleaning</p>
    <h1>What this cleanup would save</h1>
    <p class="meta" id="meta">Loading the latest run…</p>
  </header>
  <div class="tiles" id="tiles"></div>
  <p class="note" id="caveat"></p>
  <div class="legend" id="legend">
    <span><span class="pill safe">safe</span> easy to undo</span>
    <span><span class="pill careful">careful</span> delete (to the holding folder) or commit</span>
    <span><span class="pill you">you</span> change only you can make in claude.ai</span>
  </div>
  <div id="areas" style="display:grid;gap:36px"></div>
  <section id="cc-section" hidden>
    <h2>Couldn't check</h2>
    <ul class="cc" id="cc"></ul>
  </section>
</div>

<script>
const DATA = /*__DATA__*/null;
(function () {
  if (!DATA) return;
  const AREA_NAMES = { skills: 'Skills and plugins', leftovers: 'Leftover files', git: 'Uncommitted git work', notes: 'Notes drift', settings: 'Settings files', sessions: 'Old sessions', clutter: 'Scratch and transcript clutter' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmtInt = n => Math.round(n).toLocaleString('en-US');
  function fmtBytes(b) {
    if (!b) return '0 KB';
    if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + ' KB';
    if (b < 1024 ** 3) return (b / 1048576).toFixed(b < 10 * 1048576 ? 1 : 0) + ' MB';
    return (b / 1024 ** 3).toFixed(2) + ' GB';
  }
  const findings = DATA.findings || [];
  const basis = DATA.usageBasis || {};
  const run = new Date(DATA.generatedAt);
  const mode = DATA.mode || (DATA.areas && DATA.areas.length === 7 ? 'Full run' : 'Chosen areas');
  document.getElementById('meta').textContent =
    `${mode} on ${run.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })} at ${run.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}. ` +
    `${findings.length} finding${findings.length === 1 ? '' : 's'}. ` +
    (basis.sessionsLast30Days ? `Monthly figures use your ${basis.sessionsLast30Days} sessions from the last 30 days.` : '') +
    ' Pick fixes by number in the chat.';

  const counted = findings.filter(f => f.kind !== 'info');
  const tot = counted.reduce((a, f) => ({ s: a.s + (f.tokensPerSession || 0), m: a.m + (f.tokensPerMonth || 0), b: a.b + (f.storageBytes || 0) }), { s: 0, m: 0, b: 0 });
  const extraCalls = findings.filter(f => /extra Claude call/i.test(f.title)).length;
  const risks = findings.filter(f => f.kind === 'risk' || f.kind === 'accuracy').length;
  document.getElementById('tiles').innerHTML = [
    ['Tokens per session', fmtInt(tot.s), 'estimate, loaded at every session start'],
    ['Tokens per month', fmtInt(tot.m), 'estimate' + (extraCalls ? `, plus ${extraCalls} hook${extraCalls > 1 ? 's' : ''} making extra Claude calls` : '')],
    ['Storage freed', fmtBytes(tot.b), 'exact; moves to the holding folder for 30 days'],
    ['Risk and accuracy items', fmtInt(risks), 'uncommitted work or notes that no longer match'],
  ].map(([l, v, s]) => `<div class="tile"><span class="label">${esc(l)}</span><span class="value">${esc(v)}</span><span class="sub">${esc(s)}</span></div>`).join('');

  document.getElementById('caveat').textContent =
    `Token numbers are estimates: text length divided by ${(DATA.config && DATA.config.charsPerToken) || 4} characters per token. They count what gets loaded, not what you are billed; Claude reuses unchanged startup text between messages (prompt caching), so the billed effect is smaller. Storage numbers are exact file sizes. Transcripts are measured but never removed.`;

  function numCell(f, value, unit) {
    if (f.kind === 'risk') return '<span class="chip">risk</span>';
    if (f.kind === 'accuracy') return '<span class="chip">accuracy</span>';
    if (!value) return '<span class="dash">–</span>';
    return unit === 'bytes' ? fmtBytes(value) : fmtInt(value);
  }
  const order = ['skills', 'leftovers', 'git', 'notes', 'settings', 'sessions', 'clutter'];
  const html = [];
  for (const area of order) {
    if (!(DATA.areas || order).includes(area)) continue;
    const rows = findings.filter(f => f.area === area);
    const at = rows.filter(f => f.kind !== 'info').reduce((a, f) => ({ m: a.m + (f.tokensPerMonth || 0), b: a.b + (f.storageBytes || 0) }), { m: 0, b: 0 });
    const sum = [at.m ? `${fmtInt(at.m)} tokens/month` : '', at.b ? fmtBytes(at.b) : ''].filter(Boolean).join(' · ');
    html.push(`<section><h2>${esc(AREA_NAMES[area])}<span class="area-total">${rows.length} item${rows.length === 1 ? '' : 's'}${sum ? ' · ' + esc(sum) : ''}</span></h2>`);
    if (!rows.length) { html.push('<p class="empty">Nothing found.</p></section>'); continue; }
    html.push('<div class="table-wrap"><table><thead><tr><th>#</th><th>Finding</th><th>Label</th><th class="num">Storage</th><th class="num">Tokens / session</th><th class="num">Tokens / month</th></tr></thead><tbody>');
    for (const f of rows) {
      const tokBasis = f.tokenBasis ? `<span class="basis">estimate: ${esc(f.tokenBasis)}${f.tokenNote ? '; ' + esc(f.tokenNote) : ''}</span>` : (f.tokenNote ? `<span class="basis">${esc(f.tokenNote)}</span>` : '');
      const stoBasis = f.storageBytes ? `<span class="basis">${f.kind === 'info' ? 'kept, not counted' : 'exact'}</span>` : '';
      html.push(`<tr>
        <td class="id">${f.id}</td>
        <td><div class="title">${esc(f.title)}</div><div class="detail">${esc(f.detail)}</div><div class="fix"><b>Fix:</b> ${esc(f.fix)}</div></td>
        <td><span class="pill ${esc(f.label)}">${esc(f.label)}</span></td>
        <td class="num">${numCell(f, f.storageBytes, 'bytes')}${stoBasis}</td>
        <td class="num">${numCell(f, f.tokensPerSession)}</td>
        <td class="num">${numCell(f, f.tokensPerMonth)}${tokBasis}</td>
      </tr>`);
    }
    html.push('</tbody></table></div></section>');
  }
  document.getElementById('areas').innerHTML = html.join('');
  const cc = DATA.couldntCheck || [];
  if (cc.length) {
    document.getElementById('cc-section').hidden = false;
    document.getElementById('cc').innerHTML = cc.map(c => `<li><b>${esc(c.what)}:</b> ${esc(c.why)}</li>`).join('');
  }
})();
</script>
